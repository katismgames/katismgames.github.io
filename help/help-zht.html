<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Katism Games | 客戶支持</title>

    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --muted: #9da7b1;
            --accent: #3fb950;
            --border: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 16px 64px;
        }

        header {
            margin-bottom: 32px;
        }

        .brand {
            font-size: 22px;
            font-weight: 700;
        }

        .card {
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
        }

        .card h1 {
            font-size: 22px;
            margin-bottom: 12px;
        }

        .card p {
            font-size: 15px;
            color: var(--muted);
            margin-bottom: 12px;
        }

        footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
        }
    </style>
</head>

<body>
<div class="container">

    <header>
        <div class="brand">Katism Games</div>
    </header>

    <section class="card">
        <h1>客戶支持 / 諮詢指南</h1>

        <p>
            如您對 Katism Games 的手機遊戲有任何諮詢、漏洞反饋、
            帳戶或支付相關請求，請透過以下郵箱與我們聯絡。
        </p>

        <p>
            客戶諮詢將根據商店中登記的開發者聯絡方式進行處理。
        </p>

        <p style="margin-top: 16px;">
            📧 諮詢郵箱 :
            <a href="mailto:katismgames.help@gmail.com">
                katismgames.help@gmail.com
            </a>
        </p>
    </section>

    <footer>
        © 2025 Katism Games. All rights reserved.
    </footer>

</div>
</body>
</html>
