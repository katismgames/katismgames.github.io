<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katism Games</title>
    <script>
        // 메인 페이지 파일 이름 규칙 매핑
        const languageMap = {
            'ko': 'main-kor.html', // 한국어
            'en': 'main-eng.html', // 영어 (기본값)
            'ja': 'main-jpn.html', // 일본어
            'zh': 'main-zhs.html', // 중국어(간체)
            'zht': 'main-zht.html', // 중국어(번체)
            'es': 'main-spa.html', // 스페인어
            'th': 'main-tha.html'  // 태국어
        };

        const fullLang = (navigator.language || navigator.userLanguage).toLowerCase();
        const userLang = fullLang.substring(0, 2);

        let targetPage;

        // 중국어 간체/번체 구분
        if (userLang === 'zh') {
            if (fullLang.includes('tw') || fullLang.includes('hk') || fullLang.includes('mo')) {
                targetPage = languageMap['zht']; // 번체
            } else {
                targetPage = languageMap['zh']; // 간체
            }
        } else {
            targetPage = languageMap[userLang] || languageMap['en'];
        }

        // 리다이렉션 수행
        window.location.replace(targetPage);
    </script>
</head>
<body>
    <p>Redirecting to Katism Games... If it doesn't move, 
       <a href="main-eng.html">click here</a>.
    </p>
</body>
</html>
